spring:
  application:
    name: aigate
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${AIGATE_DB_URL:jdbc:h2:file:./data/aigate}
    username: sa
    password: ""
  sql:
    init:
      mode: always

server:
  port: 8080

camel:
  main:
    name: aigate
  rest:
    component: platform-http
    binding-mode: off

aigate:
  policy:
    dir: ${AIGATE_POLICY_DIR:policy}
    # Copy of the last policy that passed validation; used if policy.yaml is broken when the gateway starts.
    last-known-good: ${AIGATE_POLICY_LAST_KNOWN_GOOD:data/policy.last-known-good.yaml}
  upstream:
    # Ollama's OpenAI-compatible endpoint. throwExceptionOnFailure=false passes upstream errors through to the client.
    uri: ${AIGATE_UPSTREAM_URI:http://localhost:11434/v1/chat/completions?throwExceptionOnFailure=false}

  signatures:
    feed-url: ${AIGATE_SIGNATURES_FEED_URL:}
  budget:
    # memory: one gateway instance; redis: every instance shares the same budgets and windows.
    store: ${AIGATE_BUDGET_STORE:memory}
    redis-url: ${AIGATE_BUDGET_REDIS_URL:redis://localhost:6379}
    # allow: a Redis outage lets requests through unmetered (counted); block: such requests get 503.
    on-store-error: ${AIGATE_BUDGET_ON_STORE_ERROR:allow}
  siem:
    # Overrides the host of syslog sinks in the policy, e.g. with a container hostname.
    syslog-host: ${AIGATE_SIEM_SYSLOG_HOST:}
  guards:
    # Same OpenAI-compatible endpoint as the main model by default; guard models are small and run locally.
    uri: ${AIGATE_GUARDS_URI:http://localhost:11434/v1/chat/completions}
    harm-model: ${AIGATE_GUARD_HARM_MODEL:llama-guard3:1b}
    injection-model: ${AIGATE_GUARD_INJECTION_MODEL:granite4:3b}
    timeout: ${AIGATE_GUARDS_TIMEOUT:10s}
    # Ollama unloads idle models after 5 minutes; a cold load takes seconds, so ping the guards more often.
    warmup-enabled: ${AIGATE_GUARDS_WARMUP:true}
    keep-warm-ms: 240000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    # The Kafka client logs its full configuration on every producer start.
    org.apache.kafka: WARN
